{% extends "base.html" %}
{% block titulo %}Ingresar{% endblock %}
{% block clase_body %}pagina-login{% endblock %}
{% block contenido %}
<div class="card login-tarjeta">
  <div class="card-body p-4 p-sm-5">
    <img class="login-logo mb-4" src="{{ marca.logos.logo }}" alt="Grupo de Transporte ATM, C.A.">
    {% if error %}<div class="alert alert-danger py-2" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      {{ csrf_input }}
      <div class="mb-3">
        <label class="form-label" for="usuario">Usuario</label>
        <input class="form-control" id="usuario" name="usuario" value="{{ usuario_ingresado or '' }}"
               autocomplete="username" autocapitalize="none" required autofocus>
      </div>
      <div class="mb-4">
        <label class="form-label" for="password">Contraseña</label>
        <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary w-100">Ingresar</button>
    </form>
  </div>
</div>
<div class="login-pie">Grupo de Transporte ATM, C.A.</div>

<svg class="login-olas" viewBox="0 0 1440 120" preserveAspectRatio="none" aria-hidden="true">
  <path d="M0 70 C 240 20, 480 110, 720 70 S 1200 20, 1440 60 L1440 120 L0 120 Z" class="ola-1" opacity=".55"/>
  <path d="M0 90 C 300 50, 540 125, 820 90 S 1240 60, 1440 85 L1440 120 L0 120 Z" class="ola-2" opacity=".5"/>
</svg>
{% endblock %}
